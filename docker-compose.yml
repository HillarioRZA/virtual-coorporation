# Virtual Tech Startup Multi-Agent System - Root Orchestration
# Inspired by OpenClaw isolated workspace & gateway patterns
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: virtual-corp-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - FRONTEND_PORT=3000
    volumes:
      - ./data:/app/data
      - ./projects_output:/app/projects_output
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: virtual-corp-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
